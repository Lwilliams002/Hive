name: Hive
options:
  bundleIdPrefix: com.lwilliams
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.2"
packages:
  HiveCore:
    path: HiveCore
  # Remote SDKs for the app target only (HiveCore stays Foundation-only). Pinned exactly because Package.resolved
  # is gitignored; raised to the newest 12.x / 3.x on the Mac in Task 11 (M4 R24). GMA 12.3.0 is the first 12.x
  # whose manifest admits UMP 3.x ("1.1.0"..<"4.0.0"); 12.0.0-12.2.0 cap UMP below 3.0.0 and cannot co-resolve.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: "12.14.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: "3.1.0"
targets:
  Hive:
    type: application
    platform: iOS
    sources:
      - path: Hive
        excludes: [Resources/Levels]
      - path: Hive/Resources/Levels
        type: folder
        buildPhase: resources
    dependencies:
      - package: HiveCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.lwilliams.hive
        INFOPLIST_FILE: Hive/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"
